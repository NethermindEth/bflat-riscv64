# Linker options owned by the eh module. BuildCommand reads this file from
# the compiler layout (zisk/eh.params.yml) and appends each entry whenever
# the module is linked and the entry's conditions (libc/arch/os/eh, AND-ed,
# scalar or [list]) hold. Every --wrap here has its __wrap_* definition in
# module.c.
options:
  ld:
    # Synthetic program headers for libunwind: musl's dl_iterate_phdr walks
    # an empty dso list in a statically linked guest with no loader, so the
    # runtime would never find .eh_frame_hdr and every throw would fail fast.
    # Dropped under --remove-eh, where the unwind tables do not survive the
    # link and there is nothing left to point at (see module.c).
    - value: --wrap=dl_iterate_phdr
      eh: unwind
