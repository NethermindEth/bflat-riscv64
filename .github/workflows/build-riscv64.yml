name: Build RISC-V64

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Docker image
        type: boolean
        required: false

jobs:
  acsl_check:
    runs-on: ubuntu-latest
    # debian:bookworm, not ubuntu: frama-c was dropped from Ubuntu's recent
    # archives; bookworm ships it as frama-c-base (25.0, CLI-only).
    container:
      image: debian:bookworm
    name: ACSL contract gate (Frama-C)
    steps:
      - name: Install Frama-C
        run: |
          apt-get update
          apt-get install -y frama-c-base gcc python3

      - name: Checkout repo
        uses: actions/checkout@v4

      # Every function defined in src/bflat/modules/*/module.c must parse
      # under Frama-C (including annotations inside macro bodies, hence the
      # comment-preserving -CC preprocessing) and carry an ACSL contract.
      - name: Check ACSL contracts on native modules
        run: python3 src/bflat/scripts/check_acsl.py

  csharp_analyzers:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: "10"
            sdk_args: --channel 10.0
          - dotnet: "11"
            sdk_args: --version 11.0.100-preview.6.26359.118
    name: C# analyzers (net${{ matrix.dotnet }})
    steps:
      - name: Install .NET SDK
        run: |
          apt-get update
          apt-get install -y wget libicu-dev ca-certificates
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh ${{ matrix.sdk_args }} --install-dir /usr/share/dotnet
          ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV

      - name: Checkout repo
        uses: actions/checkout@v4

      # AnalysisMode=All is set in bflat.csproj; .editorconfig decides which
      # rules are errors. Warnings are also failed here (-warnaserror) so the
      # set stays at zero instead of drifting upwards - a rule worth keeping
      # on is worth keeping clean, and anything not worth fixing is turned
      # off explicitly, with a reason, in .editorconfig.
      - name: Build with analyzers
        run: |
          dotnet build src/bflat/bflat.csproj -t:Rebuild \
            -p:DotnetVersion=${{ matrix.dotnet }} \
            -warnaserror

  fuzz_smoke:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    name: Fuzz smoke (vfprintf + allocator)
    steps:
      - name: Install clang
        run: |
          apt-get update
          apt-get install -y clang

      - name: Checkout repo
        uses: actions/checkout@v4

      # Host-compiled with ASan+UBSan (pal's riscv asm is behind an
      # #if defined(__riscv) guard). 60s per target on PRs; the committed
      # corpus carries the interesting inputs found so far.
      - name: Run libFuzzer targets
        run: FUZZ_TIME=60 ./src/bflat/modules/tests/fuzz/run_fuzz.sh

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  cbmc_proof:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    name: CBMC allocator proof
    steps:
      - name: Install CBMC
        run: |
          apt-get update
          apt-get install -y cbmc gcc libc6-dev

      - name: Checkout repo
        uses: actions/checkout@v4

      # Proves, for ALL 64-bit sizes and ALL reachable allocator states,
      # that malloc/aligned_alloc either fail cleanly or return an
      # in-window, aligned block - the property the historic pointer
      # underflow violated.
      - name: Prove bump-allocator bounds
        run: ./src/bflat/modules/tests/verify/run_verify.sh

  module_unit_tests:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    name: Module unit tests (riscv64 under qemu)
    steps:
      - name: Install toolchain and qemu
        run: |
          apt-get update
          # qemu-user-hwe: ubuntu 26.04's name for the qemu-user-static
          # binary set (plain qemu-user-static has no candidate there).
          apt-get install -y \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user-hwe
          # Same soft-float stubs marker the module build needs.
          touch /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

      - name: Checkout repo
        uses: actions/checkout@v4

      # Cross-compiled for riscv64 and executed under qemu-user: the tests
      # run every module function on the real guest ISA, including the raw
      # ZisK exit ecall and the designed fault paths (SIGSEGV markers).
      - name: Run module unit tests
        run: ./src/bflat/modules/tests/run_tests.sh

  build_riscv64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    strategy:
      fail-fast: false
      matrix:
        include:
          # perf blobs are not published for .NET 11 yet (see ValidateVariant in
          # bflat.csproj), so the perf leg stays on .NET 10; .NET 11 ships as
          # the separate -11-min image. sdk is the SDK baked into the image and
          # must match the leg's dotnet major (an SDK only carries its own
          # major's runtime).
          - variant: perf
            dotnet: "10"
            sdk: 10.0.302
            image: nethermindeth/bflat-riscv64
          - variant: min
            dotnet: "10"
            sdk: 10.0.302
            image: nethermindeth/bflat-riscv64-min
          - variant: min
            dotnet: "11"
            sdk: 11.0.100-preview.6.26359.118
            image: nethermindeth/bflat-riscv64-11-min
    name: Build RISC-V64 (${{ matrix.variant }}, net${{ matrix.dotnet }}) on Ubuntu 26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            llvm \
            clang \
            lld \
            xxd \
            python3 \
            python3-pip \
            wget \
            curl \
            ca-certificates \
            yq \
            docker.io \
            libicu-dev
          pip3 install lief pyelftools --break-system-packages
          # gcc-riscv64-linux-gnu only ships hard-float (lp64d) glibc stubs. We
          # compile native modules with -mabi=lp64 (soft-float) to match zisk's
          # crt1.o, so we need an empty gnu/stubs-lp64.h marker.
          touch /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

      - name: Install .NET SDK (10 GA + 11 preview)
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          # SDK 10: targets net10.0 (perf leg). SDK 11 preview: targets net11.0
          # (min leg); pinned to the version the toolchain images ship.
          ./dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
          ./dotnet-install.sh --version 11.0.100-preview.6.26359.118 --install-dir /usr/share/dotnet
          ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV
          echo "/usr/share/dotnet" >> $GITHUB_PATH

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build modules (riscv64, net${{ matrix.dotnet }})
        # dotnet version matters: some native modules are contract-versioned
        # against the runtime (e.g. the ref-assign write barrier).
        run: ./build.sh modules riscv64 ${{ matrix.variant }} ${{ matrix.dotnet }}

      - name: Build bflat (riscv64, ${{ matrix.variant }}, net${{ matrix.dotnet }})
        run: ./build.sh bflat riscv64 ${{ matrix.variant }} ${{ matrix.dotnet }}

      - name: Build Docker image
        run: |
          EXTRA_TAGS=""
          if [ "${{ github.event.inputs.publish }}" = "true" ]; then
            EXTRA_TAGS="-t ${{ matrix.image }}:latest -t ${{ matrix.image }}:$GITHUB_SHA"
          fi
          docker build --platform linux/amd64 \
            --build-arg DOTNET_VERSION=${{ matrix.dotnet }} \
            --build-arg SDK_VERSION=${{ matrix.sdk }} \
            -t ${{ matrix.image }}:test \
            $EXTRA_TAGS \
            .

      - name: Check packaged variant
        run: |
          docker run --rm --platform linux/amd64 \
            ${{ matrix.image }}:test \
            bash -lc "bflat --info && bflat --info | grep -A1 '^Variant' | grep -q '${{ matrix.variant }}'"

      - name: Smoke test bflat (zisk + zisk_sim)
        run: |
          set -e
          for libc in zisk zisk_sim; do
            echo "::group::Smoke build for libc=$libc"
            docker run --rm --platform linux/amd64 \
              ${{ matrix.image }}:test \
              bash -lc "echo 'class Program { static int Main() => 0; }' > /tmp/smoke.cs && bflat build --arch riscv64 --os linux --stdlib dotnet --libc $libc --no-pie --no-pthread -o /tmp/smoke-$libc /tmp/smoke.cs && file /tmp/smoke-$libc && file /tmp/smoke-$libc | grep -q 'UCB RISC-V'"
            echo "::endgroup::"
          done

      - name: Log in to Docker Hub
        if: github.event.inputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Publish to Docker Hub
        if: github.event.inputs.publish == 'true'
        run: |
          docker push ${{ matrix.image }}:latest
          docker push "${{ matrix.image }}:$GITHUB_SHA"
