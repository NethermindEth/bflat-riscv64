name: Build RISC-V64

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Docker image
        type: boolean
        required: false
      packages_ref:
        description: Branch of bflat-libziskos, bflat-sp1 and bflat-openvm to take the zkVM platforms from
        type: string
        default: main
        required: false

# The public key of the package signatures (docs/signing.md). The bflat
# build checks the dotnet-riscv downloads with it and writes it into the
# bflat binary, which then checks the --extlib packages. A public key is not
# a secret, so it is a variable, not a secret. Without it the build checks
# nothing and says so.
env:
  BFLAT_SIGNING_PUBLIC_KEY: ${{ vars.BFLAT_SIGNING_PUBLIC_KEY }}
  # bflat builds for .NET 11 with the perf runtime of dotnet-riscv
  # (bflat.variant.props). The SDK is the one the image ships.
  SDK_VERSION: 11.0.100-preview.6.26359.118
  IMAGE: nethermindeth/bflat-riscv64-11

jobs:
  acsl_check:
    runs-on: ubuntu-latest
    # debian:bookworm, not ubuntu: frama-c was dropped from Ubuntu's recent
    # archives; bookworm ships it as frama-c-base (25.0, CLI-only).
    container:
      image: debian:bookworm
    name: ACSL contract gate (Frama-C)
    steps:
      - name: Install Frama-C
        run: |
          apt-get update
          apt-get install -y frama-c-base gcc python3

      - name: Checkout repo
        uses: actions/checkout@v4

      # Every function defined in src/bflat/modules/*/module.c must parse
      # under Frama-C (including annotations inside macro bodies, hence the
      # comment-preserving -CC preprocessing) and carry an ACSL contract.
      - name: Check ACSL contracts on native modules
        run: python3 src/bflat/scripts/check_acsl.py

  eh_proof:
    runs-on: ubuntu-latest
    name: Formal proof of the eh module (Frama-C WP + Eva)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The Debian package is CLI-only and ships no provers, so the proof
      # runs in the upstream image (WP with Alt-Ergo, plus Eva).
      - name: Pull Frama-C image
        run: docker pull framac/frama-c:30.0

      # WP discharges every contract of the code that builds the synthetic
      # program headers (RTE included); Eva then runs the module end to end
      # in both image shapes and must report zero alarms.
      - name: Run WP + Eva
        run: |
          chmod +x src/bflat/modules/eh/verify/run_wp.sh
          docker run --rm -v "$PWD":/work -w /work framac/frama-c:30.0 \
            src/bflat/modules/eh/verify/run_wp.sh

  csharp_analyzers:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    name: C# analyzers
    steps:
      - name: Install .NET SDK
        run: |
          apt-get update
          apt-get install -y wget libicu-dev ca-certificates python3 openssl
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --version "$SDK_VERSION" --install-dir /usr/share/dotnet
          ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV

      - name: Checkout repo
        uses: actions/checkout@v4

      # AnalysisMode=All is set in bflat.csproj; .editorconfig decides which
      # rules are errors. Warnings are also failed here (-warnaserror) so the
      # set stays at zero instead of drifting upwards - a rule worth keeping
      # on is worth keeping clean, and anything not worth fixing is turned
      # off explicitly, with a reason, in .editorconfig.
      - name: Build with analyzers
        # SkipCompilerLayout: this job runs no build.sh, so the native module.o
        # artifacts CreateCompilerLayout copies don't exist. Analyzers only need
        # the managed compile.
        run: |
          dotnet build src/bflat/bflat.csproj -t:Rebuild \
            -p:SkipCompilerLayout=true \
            -warnaserror

      # The module manifests have two readers that must agree: the schema
      # file (editors, the bflat-* packages) and bflat's own parser, which
      # bflat-modules shares. Neither needs the native toolchain.
      - name: Check the module manifests
        run: |
          apt-get install -y python3-jsonschema
          python3 src/bflat/scripts/check_manifests.py
          dotnet build src/bflat-modules/bflat-modules.csproj -warnaserror
          dotnet run --project src/bflat-modules/bflat-modules.csproj --no-build -- check src/bflat/modules

      # The parts of bflat that need no compiler layout: the manifest
      # parser, the package signatures (also against sign_package.py and
      # openssl), the --extlib resolution and the float-ABI check.
      - name: Unit tests
        run: dotnet test src/bflat.UnitTests/bflat.UnitTests.csproj

  fuzz_smoke:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    name: Fuzz smoke (vfprintf + allocator)
    steps:
      - name: Install clang
        run: |
          apt-get update
          apt-get install -y clang

      - name: Checkout repo
        uses: actions/checkout@v4

      # Host-compiled with ASan+UBSan (pal's riscv asm is behind an
      # #if defined(__riscv) guard). 60s per target on PRs; the committed
      # corpus carries the interesting inputs found so far.
      - name: Run libFuzzer targets
        run: FUZZ_TIME=60 ./src/bflat/modules/tests/fuzz/run_fuzz.sh

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  cbmc_proof:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    name: CBMC allocator proof
    steps:
      - name: Install CBMC
        run: |
          apt-get update
          apt-get install -y cbmc gcc libc6-dev

      - name: Checkout repo
        uses: actions/checkout@v4

      # Proves, for ALL 64-bit sizes and ALL reachable allocator states,
      # that malloc/aligned_alloc either fail cleanly or return an
      # in-window, aligned block - the property the historic pointer
      # underflow violated.
      - name: Prove bump-allocator bounds
        run: ./src/bflat/modules/tests/verify/run_verify.sh

  module_unit_tests:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    name: Module unit tests (riscv64 under qemu)
    steps:
      - name: Install toolchain and qemu
        run: |
          apt-get update
          # qemu-user-hwe: ubuntu 26.04's name for the qemu-user-static
          # binary set (plain qemu-user-static has no candidate there).
          apt-get install -y \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user-hwe
          # Same soft-float stubs marker the module build needs.
          touch /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

      - name: Checkout repo
        uses: actions/checkout@v4

      # Cross-compiled for riscv64 and executed under qemu-user: the tests
      # run every module function on the real guest ISA, including the raw
      # ZisK exit ecall and the designed fault paths (SIGSEGV markers).
      - name: Run module unit tests
        run: ./src/bflat/modules/tests/run_tests.sh

  build_riscv64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      pr_image: ${{ steps.pr_image.outputs.image }}
    container:
      image: ubuntu:26.04
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock
    name: Build RISC-V64 on Ubuntu 26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            llvm \
            clang \
            lld \
            xxd \
            python3 \
            python3-pip \
            wget \
            curl \
            ca-certificates \
            docker.io \
            libicu-dev
          pip3 install lief pyelftools --break-system-packages
          # gcc-riscv64-linux-gnu only ships hard-float (lp64d) glibc stubs. We
          # compile native modules with -mabi=lp64 (soft-float) to match zisk's
          # crt1.o, so we need an empty gnu/stubs-lp64.h marker.
          touch /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

      - name: Install .NET SDK
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --version "$SDK_VERSION" --install-dir /usr/share/dotnet
          ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV
          echo "/usr/share/dotnet" >> $GITHUB_PATH

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build modules (riscv64)
        run: ./build.sh modules riscv64

      - name: Build bflat (riscv64)
        run: ./build.sh bflat riscv64

      - name: Build Docker image
        run: |
          EXTRA_TAGS=""
          if [ "${{ inputs.publish }}" = "true" ]; then
            EXTRA_TAGS="-t $IMAGE:latest -t $IMAGE:$GITHUB_SHA"
          fi
          docker build --platform linux/amd64 \
            --build-arg SDK_VERSION="$SDK_VERSION" \
            -t $IMAGE:test \
            $EXTRA_TAGS \
            .

      - name: Check the packaged runtime
        run: |
          docker run --rm --platform linux/amd64 $IMAGE:test bash -lc "bflat --info"

      # The ordinary linux-x64 target (BflatTargetLinuxX64 in
      # bflat.variant.props). The image is linux/amd64, so the program runs
      # here.
      - name: Smoke test bflat (linux-x64)
        run: |
          docker run --rm --platform linux/amd64 $IMAGE:test bash -lc '
            set -e
            if [ ! -d /share/bflat/lib/linux/x64/glibc ]; then
              echo "This layout has no linux-x64 target"
              exit 0
            fi
            printf "%s\n" "class Program { static int Main() { System.Console.WriteLine(\"Hello from bflat\"); return 0; } }" > /tmp/hello.cs
            bflat build --arch x64 --os linux -o /tmp/hello /tmp/hello.cs
            file /tmp/hello | grep -q "x86-64"
            /tmp/hello | grep -qx "Hello from bflat"
            echo "linux-x64: OK"'

      # bflat knows no zkVM: each target is a platform (entry point, memory
      # map, manifest) in its bflat-* package. Only the platform part of each
      # package is built here - it needs nothing but binutils - into one
      # directory; the guests below do not use the bindings libraries.
      - name: Build the zkVM platforms
        env:
          PACKAGES_REF: ${{ inputs.packages_ref || 'main' }}
        run: |
          set -e
          for repo in bflat-libziskos bflat-sp1 bflat-openvm; do
            git clone --depth 1 --branch "$PACKAGES_REF" "https://github.com/NethermindEth/$repo.git" "/tmp/$repo"
            "/tmp/$repo/platform/build.sh" "$PWD/platforms"
          done
          ls -l platforms

      # docker cp rather than a bind mount: this job's checkout is not a path on the Docker host.
      - name: Smoke test bflat (every zkVM target)
        run: |
          set -e
          for libc in zisk zisk_sim sp1 openvm; do
            echo "::group::Smoke build for libc=$libc"
            id=$(docker create --platform linux/amd64 $IMAGE:test \
              bash -lc "echo 'class Program { static int Main() => 0; }' > /tmp/smoke.cs && bflat build --arch riscv64 --os linux --stdlib dotnet --libc $libc --extlib /platforms/$libc.bflat.manifest --no-pie --no-pthread -o /tmp/smoke-$libc /tmp/smoke.cs && file /tmp/smoke-$libc && file /tmp/smoke-$libc | grep -q 'UCB RISC-V'")
            docker cp platforms/. "$id:/platforms"
            rc=0
            docker start -a "$id" || rc=$?
            docker rm "$id" > /dev/null
            [ "$rc" = 0 ] || exit "$rc"
            echo "::endgroup::"
          done

      - name: Check unaligned-access codegen per zkVM target
        # docker cp rather than a bind mount: this job's checkout is not a path on the Docker host.
        run: |
          set -e
          id=$(docker create --platform linux/amd64 -e BFLAT_PLATFORMS=/platforms $IMAGE:test bash /t/run-unaligned-access.sh)
          docker cp tests/. "$id:/t"
          docker cp platforms/. "$id:/platforms"
          rc=0
          docker start -a "$id" || rc=$?
          docker rm "$id" > /dev/null
          exit "$rc"

      # bflat-ts on zk-testing pulls the image of the pull request from GHCR:
      # Docker Hub takes images of master only. One tag for each pull request,
      # and the jobs below take it by digest, so a new push does not change the
      # image of a run that is in progress. A pull request from a fork gets no
      # token to push with and no bflat-ts run.
      - name: Push the image of the pull request to GHCR
        id: pr_image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_IMAGE: ghcr.io/nethermindeth/bflat-riscv64-11:pr-${{ github.event.number }}
        run: |
          set -e
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag $IMAGE:test "$PR_IMAGE"
          docker push "$PR_IMAGE"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$PR_IMAGE" | grep '^ghcr.io/' | head -n 1)
          digest=${digest#*@}
          [ -n "$digest" ]
          echo "image=$PR_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Publish to Docker Hub
        if: inputs.publish
        run: |
          docker push $IMAGE:latest
          docker push "$IMAGE:$GITHUB_SHA"

  # bflat-ts on zk-testing with the image of the pull request. The run is a
  # workflow of bflat-ts, started with BFLAT_TS_TOKEN (Actions: read and write
  # on bflat-ts), so the secrets of zk-testing stay in bflat-ts. The simple
  # test goes first: a broken image then fails in minutes and does not take the
  # host for the two hours of the suite.
  bflat_ts_simple:
    needs: build_riscv64
    if: needs.build_riscv64.outputs.pr_image != ''
    runs-on: ubuntu-latest
    name: bflat-ts (simple)
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run bflat-ts/simple
        env:
          GH_TOKEN: ${{ secrets.BFLAT_TS_TOKEN }}
        run: .github/scripts/run-bflat-ts.sh "${{ needs.build_riscv64.outputs.pr_image }}" bflat-ts/simple

  bflat_ts:
    needs: [build_riscv64, bflat_ts_simple]
    runs-on: ubuntu-latest
    name: bflat-ts
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run the bflat-ts suite
        env:
          GH_TOKEN: ${{ secrets.BFLAT_TS_TOKEN }}
        run: .github/scripts/run-bflat-ts.sh "${{ needs.build_riscv64.outputs.pr_image }}"
